<title>AdNexis Negócios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Layout: tela de entrada em duas colunas; app com menu lateral fixo, barra superior e área de conteúdo rolável. Escuro primeiro, acento vermelho. */
:root {
  --bg: #0d0c10;
  --panel: #15161b;
  --panel2: #1c1d23;
  --line: #303139;
  --fg: #f5efdf;
  --muted: #aba9b3;
  --accent: #e32636;
  --accent2: #ff5a66;
  --accent-ink: #ffffff;
  --accent-soft: rgba(227, 38, 54, 0.14);
  --gold: #d4b88c;
  --gold-line: rgba(205, 177, 135, 0.15);
  --ok: #4ade80;
  --warn: #fbbf24;
  --glow: rgba(227, 38, 54, 0.22);
  --display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #faf8f5; --panel: #ffffff; --panel2: #f5f2ef; --line: #e8e3dd; --fg: #1a181b; --muted: #8b7d8a;
    --accent: #cc1432; --accent2: #e32636; --accent-soft: rgba(204, 20, 50, 0.1); --gold: #b8966b; --gold-line: rgba(205, 177, 135, 0.25);
    --ok: #16a34a; --warn: #b7791f; --glow: rgba(204, 20, 50, 0.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #faf8f5; --panel: #ffffff; --panel2: #f5f2ef; --line: #e8e3dd; --fg: #1a181b; --muted: #8b7d8a;
  --accent: #cc1432; --accent2: #e32636; --accent-soft: rgba(204, 20, 50, 0.1); --gold: #b8966b; --gold-line: rgba(205, 177, 135, 0.25);
  --ok: #16a34a; --warn: #b7791f; --glow: rgba(204, 20, 50, 0.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
#root { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- botões e campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); padding: 10px 16px; font-weight: 650; min-height: 44px; }
.btn:hover { border-color: var(--muted); background: var(--panel2); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* versão 3: menu agrupado, tabelas, financeiro, atendimento, api */
.nav .navtop { display: flex; flex-direction: column; gap: 4px; }
.newconvbtn { margin: 0 12px 10px; width: calc(100% - 24px); justify-content: flex-start; }

.kpi.hot { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: linear-gradient(180deg, var(--accent-soft), var(--panel)); }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; margin: 8px 0 16px; }
.chart { width: 100%; height: 170px; display: block; }
.chart rect { fill: var(--accent); }
.chart line { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 10px; }
.journey { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.jstep { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

.jstep span { color: var(--muted); font-size: 13px; }
.otable { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }

.st { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }

.drop { border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; cursor: pointer; }
.drop small { color: var(--muted); }
.drop input { display: none; }
.filerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.filerow:first-child { border-top: 0; }
.chat2 { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.clist button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; color: var(--fg); }
.clist button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.clist small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msgs { display: flex; flex-direction: column; gap: 8px; min-height: 180px; max-height: 340px; overflow-y: auto; padding: 4px 0 12px; }
.msgs .bubble { max-width: 80%; }
.steps3 { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.steps3 span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 14px; }

.steps3 i { font-style: normal; background: var(--accent); color: var(--accent-ink); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.meter { height: 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; margin: 10px 0; }

.soonpage { text-align: center; padding: 70px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

.vars { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }

.vars button:hover { border-color: var(--accent); }
.item { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.item .ihead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.preview { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.tools2 { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 16px; margin-bottom: 10px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.tools2 .wide { grid-column: 1 / -1; }
.attach { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.tag { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--bg); padding: 3px 10px; border-radius: 999px; font-size: 12px; margin: 2px 4px 2px 0; }
.apicode { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; white-space: pre; }
.dtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.dtable td, .dtable th { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); }

@media (max-width: 900px) { .chat2 { grid-template-columns: minmax(0, 1fr); } .otable .row { grid-template-columns: 1fr 1fr; } }

/* menu lateral v3.1: hierarquia, bloco Negócios em destaque, grupos retráteis */
.side .sidetop { padding: 0 0 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.side .newconvbtn { margin: 0 12px 12px; width: calc(100% - 24px); }
.nav { gap: 2px; padding: 12px 12px 16px; border-top: 0; scrollbar-width: thin; }

.nav button, .foot button { padding: 9px 12px; font-size: 14px; min-height: 40px; }

.nav .navbox button[aria-current="page"] { background: var(--accent-soft); }

/* ============ Novos estilos: Plano/Trial, Admin, Pixel, Funil Canais ============ */
/* Plano/Trial - barra superior e modal */
#bz-plan-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font: 600 14px system-ui; text-align: center; }
#bz-plan-bar a { color: var(--accent-ink); text-decoration: underline; margin-left: 8px; font-weight: 700; }
#bz-plan-modal { position: fixed; inset: 0; z-index: 101; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; }
#bz-plan-modal > div { max-width: 400px; margin: 16px; padding: 26px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); font: 15px/1.5 system-ui; text-align: center; }
#bz-plan-modal b { font-size: 18px; display: block; margin-bottom: 8px; }
#bz-plan-modal p { opacity: 0.8; margin-bottom: 16px; }
#bz-plan-modal a { display: inline-block; margin-top: 12px; padding: 11px 20px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
#bz-plan-modal button { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--muted); opacity: 0.6; cursor: pointer; }

/* Lock overlay para itens bloqueados */
.bz-locked { opacity: 0.45; position: relative; pointer-events: none; }
.bz-locked::after { content: "🔒"; font-size: 11px; margin-left: auto; padding-left: 6px; }

/* Admin menu */
.bz-admin-group { border: none !important; }
.bz-admin-group .nav-heading { color: var(--fg) !important; }
.bz-admin-group .nav-children { border-left-color: #382c36; }
.bz-admin-group .nav-children button { color: var(--muted); }
.bz-admin-group .nav-children button:hover { background: #211b24; color: #fff; border-color: #46363f; }
.bz-admin-group .nav-children button[aria-current="page"] { color: #fff; background: #28202a; border-color: #58414f; }

/* Funnel channels entry */
#bz-funnel-channels-entry { display: block; padding: 14px 18px; margin: 12px 0; border: 1px solid #65513e; border-radius: 10px; color: #e1cfb3; background: #211b17; font-size: 13px; text-decoration: none; }
#bz-funnel-channels-entry:hover { background: #2a221a; }

/* Pixel/Ads panel */
.bz-pixel-entry { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 11px 17px !important; border: 1px solid #63434d !important; border-radius: 12px !important; background: #261d25 !important; color: #f5efdf !important; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.3; cursor: pointer; margin: 12px 0; }
.bz-pixel-entry:hover { background: #38232d !important; }
.bz-pixel-panel { position: static; box-sizing: border-box; width: 100%; max-width: 100%; margin: 20px 0 !important; max-height: none; overflow: visible; scroll-margin-top: 85px; min-width: 0; background: #121014; color: #f5efdf; border: 0; border-radius: 0; padding: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; box-shadow: none; }
.bz-pixel-panel * { box-sizing: border-box; }
.bz-pixel-head { display: flex; align-items: start; justify-content: space-between; gap: 20px; padding: 8px 0 22px; border-bottom: 1px solid #362932; }
.bz-pixel-panel h2 { margin: 5px 0 8px; font-size: clamp(24px, 4vw, 32px); font-weight: 600; letter-spacing: -1px; }
.bz-pixel-panel h3 { margin: 0 0 10px; font-size: 18px; }
.bz-pixel-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #c6a878; }
.bz-pixel-panel p { margin: 6px 0 14px; color: #bdb2be; font-size: 14px; line-height: 1.6; }
.bz-pixel-body { padding: 24px 0 30px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 1fr); gap: 22px; }
.bz-pixel-card { padding: 22px; border: 1px solid #3b2d37; border-radius: 18px; background: #1b161e; }
.bz-pixel-card + .bz-pixel-card { margin-top: 16px; }
.bz-pixel-panel button, .bz-pixel-panel input, .bz-pixel-panel select { font: inherit; max-width: 100%; }
.bz-pixel-panel button { min-height: 44px; padding: 10px 16px; background: #30222d; border: 1px solid #5a3b49; border-radius: 11px; color: #f5efdf; cursor: pointer; }
.bz-pixel-panel .primary { background: var(--accent); border-color: var(--accent2); color: white; font-weight: 650; }
.bz-pixel-panel .primary:hover { background: var(--accent2); }
.bz-pixel-panel button:disabled { opacity: .5; cursor: wait; }
.bz-pixel-panel label { display: block; font-size: 13px; font-weight: 600; margin: 15px 0 7px; }
.bz-pixel-panel input:not([type=checkbox]), .bz-pixel-panel select { width: 100%; padding: 10px 14px; background: #0b0908; border: 1px solid #444; border-radius: 11px; color: #f5efdf; min-height: 44px; }

/* Assinatura/Planos card */
.bza-card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 24px; }
.bza-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 0 22px; }
.bza-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); }
.bza-head h1 { font-size: 40px; line-height: 1.05; margin: 6px 0 6px; letter-spacing: -0.02em; }
.bza-head p { margin: 0; color: var(--muted); font-size: 15px; }
.bza-all { color: var(--muted); font-size: 14px; text-decoration: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 44px; display: inline-flex; align-items: center; }
.bza-all:hover { color: var(--fg); border-color: #4a4b55; }
.bza-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }

.bza-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.bza-warn { color: var(--warn); background: rgba(251, 191, 36, .1); border: 1px solid rgba(251, 191, 36, .3); }
.bza-bad { color: var(--accent2); background: rgba(227, 38, 54, .12); border: 1px solid rgba(227, 38, 54, .4); }
.bza-usage-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); }
.bza-usage-top b { font-size: 28px; color: var(--fg); }
.bza-track { height: 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.bza-track i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

/* Product editorial */
.bz-products { --pc-gold: var(--gold); --pc-line: var(--gold-line); width: 100%; max-width: 1400px; gap: 32px !important; }
.bz-products > .rd-head { padding: 12px 0 26px; align-items: center; }
.bz-products > .rd-head p { max-width: 520px; color: var(--muted); line-height: 1.6; }
.bz-products .resource-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); align-items: start; gap: 24px; }

.bz-product-editorial:hover { border-color: var(--gold-line) !important; transform: translateY(-2px); }
.bze-cover { width: 100% !important; max-width: none !important; align-self: stretch !important; box-sizing: border-box; position: relative; aspect-ratio: 2.15; min-height: 145px; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 75% 0, #61503b55, transparent 65%), linear-gradient(135deg, #25221f, #121212); }
.bze-cover::after { content: ''; position: absolute; inset: 12px; border: 1px solid #dfc69e16; border-radius: 12px; pointer-events: none; }
.bze-monogram { font: 500 74px/1 Georgia, serif; color: var(--gold); text-shadow: 0 8px 30px #0009; }
.bze-state { position: absolute; top: 23px; left: 24px; background: #161615d9; border: 1px solid #ffffff18; padding: 6px 10px; border-radius: 30px; font-size: 11px; color: #d8e5cd; z-index: 1; }
.bze-state::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; }
.bze-state.paused { color: #d5c5ad; }
.bze-state.paused::before { background: var(--gold); }
.bze-category { position: absolute; bottom: 20px; right: 25px; color: #d5c2a3; font-size: 9px; letter-spacing: .2em; z-index: 1; }
.bze-content { display: grid; gap: 22px; padding: 24px; }
.bze-content > h3 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
.bze-description { font-size: 14px; line-height: 1.6; color: var(--fg); }
.bze-facts { display: flex; flex-wrap: wrap; gap: 16px; padding-bottom: 8px; }
.bze-facts strong { font-size: 16px; }
.bze-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bze-actions .button { min-height: 46px; padding: 12px; border-radius: 10px; }

/* Product flow */
.bz-product-flow { width: 100%; box-sizing: border-box; scroll-margin-top: 85px; gap: 24px; }
.bz-product-flow-head h2 { margin: 6px 0; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.035em; }
.bz-product-flow-head p, .bz-product-hint { color: var(--muted); font-size: 14px; line-height: 1.6; }
.bz-product-steps { list-style: none; display: flex; gap: 12px; padding: 0; margin: 0; }
.bz-product-steps li { display: flex; align-items: center; gap: 8px; flex: 1; color: var(--muted); font-size: 14px; border-bottom: 2px solid rgba(255, 255, 255, .1); padding-bottom: 14px; }
.bz-product-steps li > span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; border: 1px solid currentColor; font-size: 12px; }
.bz-product-steps .current { color: var(--fg); border-color: var(--accent); }
.bz-product-steps .current > span { background: var(--accent); border-color: var(--accent); }
.bz-product-steps .done { color: #9fcaad; }
.bz-product-step-body { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.bz-product-step-body[hidden] { display: none !important; }
.bz-product-flow input, .bz-product-flow textarea, .bz-product-flow select { font-size: 16px; max-width: 100%; box-sizing: border-box; }
.bz-product-flow-actions { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid rgba(255, 255, 255, .1); padding-top: 20px; }
.bz-product-flow-actions .button { min-height: 48px; }
.bz-product-summary, .bz-product-pending { border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: rgba(255, 255, 255, .025); overflow-wrap: anywhere; }
.bz-product-summary h3, .bz-product-summary p, .bz-product-pending p { margin: 0; }
.bz-product-summary-row { display: flex; justify-content: space-between; gap: 14px; border-top: 1px solid rgba(255, 255, 255, .08); padding-top: 12px; }
.bz-product-error { color: #ffb5ba; line-height: 1.5; }
.bz-product-pending { border-color: #8c743f; }

    function play(nd, guard) {
      var g = 0;
      while (nd && g++ < 30) {
        nd.items.forEach(function (it) { var tx = itemPreview(it, vars); if (it.type === "text" && it.ab && it.textB) tx += "\n(teste A/B: a variante B também é enviada para metade dos clientes)"; log.push({ who: "ia", text: tx }); if (it.type === "action" && it.act === "handoff") st = "human"; if (it.type === "action" && it.act === "sale") log.push({ who: "sys", text: "Venda registrada no funil (simulação)." }); });

        if (nd.kind === "pergunta") { st = "waiting"; cur = nd; return; }
        var nx = nodeById(f, nd.next);

        S.fups.forEach(function (fu) { var mins = fu.after * (fu.unit === "h" ? 60 : fu.unit === "d" ? 1440 : 1); if (fu.on && !fired[fu.id] && clock >= mins && st !== "human" && st !== "start") { fired[fu.id] = 1; log.push({ who: "ia", text: sub(fu.text, vars) + "\n(follow-up: " + fu.name + ")" }); } });
        return;
      }
      log.push({ who: "cli", text: ln });
      var words = (S.wa.words || "").split(",").map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean);
      if (st !== "human" && st !== "start" && words.some(function (w) { return ln.toLowerCase().indexOf(w) >= 0; })) { st = "human"; log.push({ who: "ia", text: S.wa.handoff }); log.push({ who: "sys", text: "A conversa passa para um atendente humano." }); return; }
      if (st === "human") { log.push({ who: "sys", text: "Conversa com atendente humano: a IA não responde." }); return; }

    });
    return log;
  }

      var m = document.createElement("div");
      m.id = "bz-plan-modal";
      m.innerHTML = '<div><b style="font-size:18px">Disponível na assinatura</b><p style="opacity:.8">No teste grátis você usa o Prospectar, o WhatsApp e a IA que vende. Assine o AdNexis para liberar todas as outras áreas.</p><a href="#plans" data-act="plangoto">Assinar o AdNexis</a><button type="button" data-act="planclose">Agora não</button></div>';
      m.onclick = function (e) { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); };
      document.body.appendChild(m);
    }
    
    function lockRestricted() {
      var currentView = S.view;
      var isAllowed = allowedViews.indexOf(currentView) >= 0;
      
      if (!isAllowed && !P.expired && !P.trialDayLocked) return;
      
      // Lock nav items in sidebar
      document.querySelectorAll('[data-act="nav"]').forEach(function (el) {
        var view = el.getAttribute('data-v');
        if (view && allowedViews.indexOf(view.split(':')[0]) < 0) {
          if (!el.classList.contains('bz-locked')) {
            el.classList.add('bz-locked');
            el.addEventListener('click', function (e) {
              e.preventDefault();
              e.stopImmediatePropagation();
              showModal();
            }, true);
          }
        }
      });
      
      // Lock other links
      document.querySelectorAll('a[href^="#"], a[href^="/app/"]').forEach(function (el) {
        var href = el.getAttribute('href') || '';
        var view = href.replace(/^#/, '').replace(/^\//, '').split('?')[0].split('/')[0];
        if (view && allowedViews.indexOf(view) < 0 && view !== 'app' && view !== '') {
          if (!el.classList.contains('bz-locked')) {
            el.classList.add('bz-locked');
            el.addEventListener('click', function (e) {
              e.preventDefault();
              e.stopImmediatePropagation();
              showModal();
            }, true);
          }
        }
      });
    }
    
    // Check trial status on load
    var now = Date.now();
    if (now > P.trialEnds) {
      P.expired = true;
    }
    if (P.trialSpent >= P.trialCap) {
      P.trialDayLocked = true;
    }
    
    // Initialize UI
    showBar();
    lockRestricted();
    
    // Re-check on navigation
    var originalGotoNav = gotoNav;
    gotoNav = function (v) {
      originalGotoNav(v);
      setTimeout(function () {
        lockRestricted();
      }, 50);
    };
    
    // Expose for external use
    window.bzPlan = { showBar: showBar, showModal: showModal, lockRestricted: lockRestricted };
  })();
  
  /* ============ Supabase Init (Fase 3) ============ */
  (function () {
    if (typeof window.supabase === "undefined") { console.warn("Supabase SDK não carregado"); return; }
    if (!SUPABASE_URL || SUPABASE_URL.includes("SEU_PROJETO")) { console.log("Supabase não configurado (use localStorage)"); return; }
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log("Supabase conectado");
      
      supabaseClient.auth.onAuthStateChange(function (event, session) {
        if (session?.user) { S.auth = true; loadUserData(session.user.id); }
        else { S.auth = false; }
        render();
      });
      
      supabaseClient.auth.getSession().then(function (res) {
        if (res.data.session?.user) { S.auth = true; loadUserData(res.data.session.user.id); }
        render();
      });
    } catch (e) { console.error("Erro Supabase:", e); }
  
  async function loadUserData(userId) {
    try {
      var sb = supabaseClient;
      var profile = await sb.from("profiles").select("*").eq("id", userId).single();
      if (profile.data) { S.prof.name = profile.data.name || ""; S.prof.email = profile.data.email || ""; S.prof.area = profile.data.area || ""; S.biz = profile.data.biz || ""; }
      var settings = await sb.from("user_settings").select("*").eq("user_id", userId).single();
      if (settings.data) { Object.assign(S, settings.data); ["wa", "rhythm", "fin", "ord", "chat_opts", "plan"].forEach(function(k) { if (typeof S[k] === "string") S[k] = JSON.parse(S[k]); }); }
      var ads = await sb.from("ads").select("*").eq("user_id", userId).single();
      if (ads.data) { S.ads = ads.data; if (typeof S.ads.form === "string") S.ads.form = JSON.parse(S.ads.form); if (typeof S.ads.resultados === "string") S.ads.resultados = JSON.parse(S.ads.resultados); if (typeof S.ads.salvos === "string") S.ads.salvos = JSON.parse(S.ads.salvos); }
      var prods = await sb.from("products").select("*").eq("user_id", userId);
      if (prods.data) S.products = prods.data;
      var funnels = await sb.from("funnels").select("*").eq("user_id", userId);
      if (funnels.data) { S.flows = funnels.data; if (S.flows[0]) S.fsel = S.flows[0].id; }
      var chips = await sb.from("wa_chips").select("*").eq("user_id", userId);
      if (chips.data) S.chips = chips.data;
      var orders = await sb.from("orders").select("*").eq("user_id", userId);
      if (orders.data) S.orders = orders.data;
      var chats = await sb.from("chats").select("*").eq("user_id", userId);
      if (chats.data) S.chats = chats.data;
      var convs = await sb.from("ai_conversations").select("*").eq("user_id", userId);
      if (convs.data) S.convs = convs.data;
      var migrated = localStorage.getItem("sb_migrated");
      if (!migrated && S.products.length === 0 && S.flows.length === 0) { await migrateLocalStorage(); }
    } catch (e) { console.error("Erro ao carregar dados:", e); }
  }
  
  async function migrateLocalStorage() {
    try {
      var KEY = "adnexis-negocios-v1";
      var local = JSON.parse(localStorage.getItem(KEY) || "{}");
      var user = await supabaseClient.auth.getUser();
      var userId = user.data.user?.id;
      if (!userId) return;
      var sb = supabaseClient;
      if (local.products?.length) { for (var p of local.products) { await sb.from("products").insert({ user_id: userId, name: p.name, type: p.type, comm: p.comm, price: p.price, desc: p.desc, offers: p.offers, trial: p.trial, code: p.code, ex: p.ex }); } }
      if (local.flows?.length) { for (var f of local.flows) { await sb.from("funnels").insert({ user_id: userId, name: f.name, product_id: f.product, pub: f.pub, ai: f.ai, brain: f.brain, convs: f.convs, sales: f.sales, nodes: f.nodes, versions: f.versions }); } }
      if (local.chips?.length) { for (var c of local.chips) { await sb.from("wa_chips").insert({ user_id: userId, name: c.name, num: c.num, on: c.on, funnel_id: c.flow }); } }
      if (local.orders?.length) { for (var o of local.orders) { await sb.from("orders").insert({ user_id: userId, customer: o.customer, product: o.product, value: o.value, status: o.status, pay: o.pay, ex: o.ex }); } }
      if (local.chats?.length) { for (var c of local.chats) { await sb.from("chats").insert({ user_id: userId, name: c.name, human: c.human, ex: c.ex, msgs: c.msgs }); } }
      if (local.convs?.length) { for (var c of local.convs) { await sb.from("ai_conversations").insert({ user_id: userId, title: c.title, msgs: c.msgs }); } }
      await sb.from("user_settings").upsert({ user_id: userId, ...local });
      if (local.ads) { await sb.from("ads").upsert({ user_id: userId, ...local.ads }); }
      localStorage.setItem("sb_migrated", "true");
      console.log("Migração localStorage -> Supabase concluída");
    } catch (e) { console.error("Erro migração:", e); }
  }
  
  var originalSave = save;
  save = function () {
    originalSave();
    if (supabaseClient) {
      supabaseClient.auth.getUser().then(function(res) {
        var user = res.data.user;
        if (!user) return;
        var sb = supabaseClient;
        sb.from("user_settings").upsert({ user_id: user.id, ...S });
        sb.from("ads").upsert({ user_id: user.id, ...S.ads });
      });
    }
  };
  
  window.adnexisSupabase = { client: function() { return supabaseClient; } };
  })();
  
  render();
})();
</script>

</body></html>
